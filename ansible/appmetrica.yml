---
- name: Deploy AppMetrica import scripts
  hosts: clickhouse
  become: true
  vars_files:
    - vars/main.yml
    - vars/vault.yml

  tasks:
    - name: Create scripts directory
      file:
        path: /opt/scripts
        state: directory
        mode: "0755"

    - name: Sync appmetrica directory
      synchronize:
        src: "{{ playbook_dir }}/../appmetrica/"
        dest: /opt/scripts/appmetrica/
        rsync_opts:
          - "--exclude=.env"
          - "--exclude=logs"
          - "--exclude=__pycache__"

    - name: Sync requirements.txt
      copy:
        src: "{{ playbook_dir }}/../requirements.txt"
        dest: /opt/scripts/requirements.txt

    - name: Create Python virtualenv
      command: python3 -m venv --clear /opt/scripts/.venv

    - name: Install Python dependencies
      command: /opt/scripts/.venv/bin/python3 -m pip install -r /opt/scripts/requirements.txt

    - name: Deploy AppMetrica .env config
      template:
        src: templates/appmetrica_env.j2
        dest: "/opt/scripts/appmetrica/.env"
        mode: "0600"

    - name: Run AppMetrica init script
      command: "/opt/scripts/.venv/bin/python3 /opt/scripts/appmetrica/init.py"
      args:
        chdir: "/opt/scripts/appmetrica"

    - name: Setup cron job for AppMetrica import
      cron:
        name: "appmetrica import"
        minute: "30"
        hour: "4"
        job: "/opt/scripts/.venv/bin/python3 /opt/scripts/appmetrica/insert.py 1>> /opt/scripts/appmetrica/logs 2>> /opt/scripts/appmetrica/logs"
